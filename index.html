<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a5f2a" />
  <meta name="description" content="Excursion - Éditeur et lecteur de circuits de randonnée multimédia" />
  <title>Excursion</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>🥾 Excursion</h1>
    <div class="mode-switch">
      <label><input type="radio" name="mode" value="production" checked /> Production</label>
      <label><input type="radio" name="mode" value="visite" /> Visite</label>
    </div>
  </header>

  <main>
    <!-- Panneau Production -->
    <section id="panel-production" class="panel active">
      <div class="toolbar">
        <label class="btn file-btn">
          📂 Ouvrir GPX / KML / KMZ
          <input type="file" id="file-input-prod" accept=".gpx,.kml,.kmz" hidden />
        </label>
        <button id="btn-add-wp" class="btn" disabled>+ Waypoint</button>
        <button id="btn-save-kmz" class="btn primary" disabled>💾 Sauver KMZ</button>
        <select id="basemap-prod" class="basemap-select">
          <option value="osm">OSM</option>
          <option value="ign-plan">IGN Plan V2</option>
          <option value="ign-ortho">IGN BD Ortho</option>
          <option value="mbtiles" disabled>MBTiles (charger…)</option>
        </select>
        <label class="btn file-btn" title="Charger un fichier MBTiles local">
          🗺️ MBTiles
          <input type="file" id="mbtiles-input-prod" accept=".mbtiles" hidden />
        </label>
        <button id="btn-geoloc-prod" class="btn btn-geoloc" title="Ma position GPS">📍 GPS</button>
      </div>
      <div id="map-prod" class="map"></div>
      <aside id="sidebar-prod" class="sidebar">
        <h3>Waypoints</h3>
        <ul id="wp-list-prod"></ul>
        <div id="wp-editor" class="wp-editor hidden">
          <h4>Édition waypoint</h4>
          <label>Nom <input type="text" id="wp-name" /></label>
          <label>Commentaire / HTML
            <textarea id="wp-comment" rows="3"></textarea>
          </label>
          <div class="media-field">
            <label>Photo <input type="file" id="wp-photo" accept="image/*" /></label>
            <div id="wp-photo-status" class="media-status hidden">
              <span class="media-status-label">📷 Photo attachée</span>
              <button type="button" class="btn-remove-media" data-media="photo" title="Retirer la photo">✕ Retirer</button>
            </div>
          </div>
          <div class="media-field">
            <label>Vidéo <input type="file" id="wp-video" accept="video/*" /></label>
            <div id="wp-video-status" class="media-status hidden">
              <span class="media-status-label">🎬 Vidéo attachée</span>
              <button type="button" class="btn-remove-media" data-media="video" title="Retirer la vidéo">✕ Retirer</button>
            </div>
          </div>
          <div class="media-field">
            <label>Audio <input type="file" id="wp-audio" accept="audio/*" /></label>
            <div id="wp-audio-status" class="media-status hidden">
              <span class="media-status-label">🔊 Audio attaché</span>
              <button type="button" class="btn-remove-media" data-media="audio" title="Retirer l’audio">✕ Retirer</button>
            </div>
          </div>
          <div class="media-field">
            <label>Page HTML <input type="file" id="wp-html" accept=".htm,.html" /></label>
            <div id="wp-html-status" class="media-status hidden">
              <span class="media-status-label">🌐 Page HTML attachée</span>
              <button type="button" class="btn-remove-media" data-media="html" title="Retirer la page HTML">✕ Retirer</button>
            </div>
          </div>
          <div class="editor-actions">
            <button id="wp-save" class="btn primary">Enregistrer</button>
            <button id="wp-delete" class="btn danger">Supprimer</button>
            <button id="wp-cancel" class="btn">Annuler</button>
          </div>
        </div>
      </aside>
    </section>

    <!-- Panneau Visite -->
    <section id="panel-visite" class="panel">
      <div class="toolbar">
        <label class="btn file-btn">
          📂 Ouvrir KMZ
          <input type="file" id="file-input-visite" accept=".kmz" hidden />
        </label>
        <button id="btn-prev" class="btn" disabled>◀ Précédent</button>
        <button id="btn-next" class="btn" disabled>Suivant ▶</button>
        <select id="basemap-visite" class="basemap-select">
          <option value="osm">OSM</option>
          <option value="ign-plan">IGN Plan V2</option>
          <option value="ign-ortho">IGN BD Ortho</option>
          <option value="mbtiles" disabled>MBTiles (charger…)</option>
        </select>
        <label class="btn file-btn" title="Charger un fichier MBTiles local">
          🗺️ MBTiles
          <input type="file" id="mbtiles-input-visite" accept=".mbtiles" hidden />
        </label>
        <button id="btn-geoloc-visite" class="btn btn-geoloc" title="Ma position GPS">📍 GPS</button>
      </div>
      <div id="map-visite" class="map"></div>
      <aside id="sidebar-visite" class="sidebar">
        <h3>Visite</h3>
        <div id="visite-info">Chargez un fichier KMZ pour commencer.</div>
        <ul id="wp-list-visite"></ul>
      </aside>
    </section>
  </main>

  <div id="status" class="status"></div>

  <!-- Lightbox agrandissement photo / vidéo -->
  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
    <button type="button" class="lightbox-close" aria-label="Fermer">&times;</button>
    <img id="lightbox-img" class="lightbox-media hidden" src="" alt="Photo agrandie" />
    <video id="lightbox-video" class="lightbox-media hidden" controls playsinline></video>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://unpkg.com/@mapbox/togeojson@0.16.2/togeojson.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
